version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: composer install --prefer-dist --no-progress
      - run:
          name: Run lint
          command: composer lint
  test:
    machine:
      image: ubuntu-2204:current
    # resource_class: large
    steps:
      - checkout

      - run:
          name: Setup Environment Variables
          command: |
            # Create .env file for docker-compose
            # CircleCI environment variables must be set in the project settings
            if [ -z "$MAGENTO_PUBLIC_KEY" ] || [ -z "$MAGENTO_PRIVATE_KEY" ]; then
              echo "Error: MAGENTO_PUBLIC_KEY and MAGENTO_PRIVATE_KEY must be set in CircleCI environment variables."
              exit 1
            fi
            echo "MAGENTO_PUBLIC_KEY=$MAGENTO_PUBLIC_KEY" >> docker/.env
            echo "MAGENTO_PRIVATE_KEY=$MAGENTO_PRIVATE_KEY" >> docker/.env

      - run:
          name: Start Docker Environment
          command: |
            cd docker
            docker compose up -d --build

      - run:
          name: Wait for Magento Initialization
          command: |
            cd docker
            echo "Waiting for Magento to install and initialize and the module to be enabled..."
            # Timeout after 15 minutes (Magento install can be slow)
            timeout 900s bash -c '
              until docker compose logs magento | grep -q "TwoPerformant_BusinessLeagueMarketing module is ready."; do 
                echo "Waiting for module to be enabled..."
                sleep 10
              done
            ' || { echo "Timed out waiting for Magento"; exit 1; }
            echo "Magento is ready."

      - run:
          name: Run Integration Tests
          command: |
            cd docker
            # Run the integration tests for the module
            # We point phpunit to the module's test directory which is mounted in the container
            docker compose exec magento bash -c "cd dev/tests/integration && ../../../vendor/bin/phpunit ../../../vendor/two-performant/business-league-marketing/Test/Integration/"

workflows:
  version: 2
  test:
    jobs:
      - lint
      - test:
          requires:
            - lint
