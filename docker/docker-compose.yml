name: magento
services:
  magento:
    build:
      context: .
      args:
        MAGENTO_PUBLIC_KEY: ${MAGENTO_PUBLIC_KEY}
        MAGENTO_PRIVATE_KEY: ${MAGENTO_PRIVATE_KEY}
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - MAGENTO_RUN_MODE=developer
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html/packages/two-performant/business-league-marketing
      - ./install-config-mysql.php:/var/www/html/dev/tests/integration/etc/install-config-mysql.php
    command: >
      bash -lc '
        set -e
        if [ ! -f app/etc/env.php ]; then
          php -dmemory_limit=-1 bin/magento setup:install \
            --base-url=http://127.0.0.1:8000 \
            --db-host=db \
            --db-name=magento \
            --db-user=root \
            --db-password=root \
            --backend-frontname=admin \
            --admin-firstname=Admin \
            --admin-lastname=User \
            --admin-email=admin@example.com \
            --admin-user=admin \
            --admin-password=Admin123! \
            --language=en_US \
            --currency=RON \
            --timezone=Europe/Bucharest \
            --use-rewrites=1 \
            --search-engine=elasticsearch8 \
            --elasticsearch-host=elasticsearch \
            --elasticsearch-port=9200 \
            --elasticsearch-enable-auth=0 \
            --elasticsearch-index-prefix=magento \
            --elasticsearch-timeout=15
        fi
        composer config repositories.local-module path /var/www/html/packages/two-performant/business-league-marketing
        composer require two-performant/business-league-marketing:@dev
        bin/magento module:enable TwoPerformant_BusinessLeagueMarketing
        bin/magento setup:upgrade
        echo "TwoPerformant_BusinessLeagueMarketing module is ready."
        exec /usr/local/sbin/php-fpm
      '
  nginx:
    image: markoshust/magento-nginx:1.18
    depends_on:
      - magento
    volumes_from:
      - magento
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8000:80 
    
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 33060:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot > /dev/null 2>&1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=magento
    volumes:
      - dbdata:/var/lib/mysql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - action.destructive_requires_name=true
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  dbdata:
